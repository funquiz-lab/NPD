    ],

let current = 0;
const answers = new Array(questions.length).fill(-1);

const questionsWrap = document.getElementById("questionsWrap");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const resultCard = document.getElementById("resultCard");
const previewTitle = document.getElementById("previewTitle");
const previewText = document.getElementById("previewText");
const fullResult = document.getElementById("fullResult");

function renderQuestion() {
  const q = questions[current];
  questionsWrap.innerHTML = "";

  const title = document.createElement("div");
  title.className = "question";
  title.textContent = q.q;
  questionsWrap.appendChild(title);

  const options = document.createElement("div");
  options.className = "options";

  q.opts.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    if (answers[current] === i) div.classList.add("selected");
    div.onclick = () => {
      answers[current] = i;
      renderQuestion();
    };
    options.appendChild(div);
  });

  questionsWrap.appendChild(options);

  progressFill.style.width = ((current + 1) / questions.length * 100) + "%";
  progressText.textContent = `${current + 1} / ${questions.length}`;

  prevBtn.style.display = current === 0 ? "none" : "inline-block";

  if (current === questions.length - 1) {
    nextBtn.style.display = "none";
    submitBtn.style.display = "inline-block";
  } else {
    nextBtn.style.display = "inline-block";
    submitBtn.style.display = "none";
  }
}

prevBtn.onclick = () => {
  if (current > 0) {
    current--;
    renderQuestion();
  }
};

nextBtn.onclick = () => {
  if (answers[current] === -1) {
    alert("请先选择一个选项。");
    return;
  }
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  }
};

submitBtn.onclick = () => {
  if (answers.includes(-1)) {
    alert("请完成所有题目后再查看结果。");
    return;
  }
  showResult();
};

function calcResult() {
  const scores = {
    "夸大型显性NPD": 0,
    "脆弱受害者型NPD": 0,
    "权力掌控型NPD": 0,
    "虚荣形象型NPD": 0,
    "智识说教型NPD": 0,
    "恶性施虐型NPD": 0
  };

  const mapping = {
    "夸大型显性NPD": ["B2", "D2", "B2", "D2", "B2", "D2", "B2", "D2", "B2", "D2", "B2", "D2", "D2", "C2", "B2", "B2", "B2", "D2", "B2", "C2", "D2", "D2", "D2", "B2", "D2"],
    "脆弱受害者型NPD": ["C1", "C1", "C1", "D1", "C1", "C1", "C1", "C1", "C1", "C1", "C1", "C1", "D1", "D1", "C1", "C1", "D1", "C1", "D1", "D1", "C1", "C1", "C1", "C1", "C1"],
    "权力掌控型NPD": ["B1", "B2", "B2", "C1", "B1", "B1", "B1", "B1", "B1", "B2", "B2", "B1", "B1", "B1", "B2", "B2", "B1", "B1", "B2", "B1", "B1", "B1", "B2", "B1", "B1"],
    "虚荣形象型NPD": ["D1", "D1", "D1", "B2", "D1", "D1", "D1", "D1", "D1", "D1", "D1", "D1", "B1", "D1", "D1", "D1", "C1", "B1", "D1", "B1", "C1", "B1", "B1", "D1", "B1"],
    "智识说教型NPD": ["B1", "B1", "B1", "B1", "B2", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B1", "B2", "B1", "B1", "B1", "B1", "B1", "B1"],
    "恶性施虐型NPD": ["D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2", "D2"]
  };

  questions.forEach((q, i) => {
    const chosen = answers[i];
    const key = q.score[chosen];
    for (const type in mapping) {
      if (mapping[type][i] === key) {
        scores[type]++;
      }
    }
  });

  let maxType = "夸大型显性NPD";
  let maxScore = 0;
  for (const type in scores) {
    if (scores[type] > maxScore) {
      maxScore = scores[type];
      maxType = type;
    }
  }

  return { type: maxType, scores };
}
